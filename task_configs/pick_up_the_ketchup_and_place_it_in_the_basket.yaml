    explanation: "- In frame 147, the object is in the basket, but the gripper is already **open**, and there is a visible distance between the gripper and the object. This indicates the gripper released the object prematurely. This is a critical failure.\n- Conclusion: label = fail, violations = [\"early_release\"]"
    frames:
      - frame_idx: 147
        paths:
