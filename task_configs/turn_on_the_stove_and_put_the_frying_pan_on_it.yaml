task_description: "Turn on the stove and put the frying pan on it."

system_prompt: |
  You are a strict evaluator for a robot's 'precise placement' task.
  The specific task is: **{task_description}**.

  A 'precise placement' is defined as placing an object in the **exact center** of a target location.
  Your goal is to determine if the episode meets the following condition based on the provided keyframes:
  1) In the **final frame** of the trajectory, the frying pan must be placed **precisely in the center of the stove burner**.
  
  **CRITICAL WARNING ON PERSPECTIVE:** The camera has a perspective angle. A truly centered object may NOT appear perfectly centered in the 2D image. You must learn to interpret 3D placement from the subtle visual cues of perspective. The gap behind the object should appear larger than the gap in front.
  
  Core Criterion: **The pan must be well-aligned with the center of the burner, not significantly off-center to the left, right, front, or back.**
  Key Observation: In the last frame, observe the pan's position relative to the stove's circular markings. Is it centered?
  If the evidence is insufficient or placement accuracy is ambiguous, output 'unknown'.
  You must output a single, raw JSON object (UTF-8, no extra text) that strictly follows the provided schema.

  
schema_text: |
  The output JSON must strictly follow this schema:
  {
    "episode_id": <int>,
    "label": "success|fail|unknown",
    "violations": ["imprecise_placement"|"missed_target"|"other"...],
    "key_moments": [
      {"frame_idx": <int>, "type": "pick_start|grasped|over_target|precise_placement", "evidence": "<string>"}
    ],
    "reason": "<string>"
  }
  Key Schema Points:
  - `precise_placement` is the sole indicator of a successful placement. It defines the final successful state.
  - Condition for `precise_placement`: In the final frame, the frying pan is visually centered on the stove burner.
  - If the pan is placed on the stove but is clearly not centered, it is a "fail" with the violation "imprecise_placement".

evaluation_criteria: |
  Evaluation Criteria:
  - **Success (Precise Placement)**: In the **final frame** of the trajectory, the frying pan is accurately centered on the stove burner.
  - **Failure (Imprecise Placement)**: The frying pan is placed on the stove but is noticeably off-center.

success_examples:
  - title: "Success Case 1: Precise Placement"
    explanation: |
      - **This is the gold standard for a successful placement.**
      - Look closely at the Main View. Because of the camera's perspective angle, the gap front the pan (top of the image) **appears larger** than the gap in behind of it (bottom of the image).
      - This visual asymmetry is **expected and correct**. It is the visual signature of a pan that is truly centered in 3D space when viewed from this angle.
      - Conclusion: label = success
    frames:
      - frame_idx: 254
        paths:
          main: "sampled_frames_output/task_3/episode_11/frame_0254_main.png"
          wrist: "sampled_frames_output/task_3/episode_11/frame_0254_wrist.png"

          
failure_examples:
  - title: "Failure Case 1: Imprecise Placement"
    explanation: "- In frame 286, the frying pan is placed too far to the right and back. It is clearly not centered on the burner. This is a critical failure.\n- Conclusion: label = fail, violations = [\"imprecise_placement\"]"
    frames:
      - frame_idx: 286
        paths:
