task_description: "Pick up the book and place it in the caddy."

system_prompt: |
  You are a strict evaluator for a robot's 'precise orientation placement' task.
  The specific task is: **{task_description}**.

  A 'precise orientation placement' is defined as placing an object with the **correct angle** into a target container.
  Your goal is to determine if the episode meets the following condition based on the provided keyframes:
  1) In the **final frame** of the trajectory, the book must be inserted **straight and parallel** to the walls of the caddy's compartment.
  Core Criterion: **The book must not be noticeably tilted or crooked upon final placement.**
  Key Observation: In the last frame, observe the alignment of the book's edges relative to the compartment's edges. Are they parallel?
  If the evidence is insufficient or the angle is ambiguous, output 'unknown'.
  You must output a single, raw JSON object (UTF-8, no extra text) that strictly follows the provided schema.

schema_text: |
  The output JSON must strictly follow this schema:
  {
    "episode_id": <int>,
    "label": "success|fail|unknown",
    "violations": ["tilted_placement"|"missed_target"|"other"...],
    "key_moments": [
      {"frame_idx": <int>, "type": "pick_start|grasped|over_target|precise_placement", "evidence": "<string>"}
    ],
    "reason": "<string>"
  }
  Key Schema Points:
  - `precise_placement` is the sole indicator of a successful placement, focusing on correct orientation.
  - If the book is placed in the caddy but at a wrong angle, it is a "fail" with the violation "tilted_placement".

evaluation_criteria: |
  Evaluation Criteria:
  - **Success (Precise Placement)**: In the **final frame**, the book is inserted straight into the caddy, with its sides parallel to the compartment walls.
  - **Failure (Tilted Placement)**: The book is inserted at a noticeable angle, not parallel to the compartment walls.

success_examples:
  - title: "Success Case 1: Correct Orientation Placement"
    explanation: "- In the final frame (136), the book is inserted perfectly straight into the caddy. Its spine is parallel to the compartment walls. This is a successful placement.\n- Conclusion: label = success"
    frames:
      - frame_idx: 136
        paths:
          main: "sampled_frames_output/task_5/episode_3/frame_0136_main.png"
          wrist: "sampled_frames_output/task_5/episode_3/frame_0136_wrist.png"
  - title: "Success Case 2: Correct Orientation Placement"
    explanation: "- In the final frame (131), the book is well-aligned and straight as it is placed into the compartment. This meets the criteria for precise placement.\n- Conclusion: label = success"
    frames:
      - frame_idx: 131
        paths:
          main: "sampled_frames_output/task_5/episode_5/frame_0131_main.png"
          wrist: "sampled_frames_output/task_5/episode_5/frame_0131_wrist.png"

failure_examples:
  - title: "Failure Case 1: Tilted Placement"
    explanation: "- In frame 120, the book is inserted at a significant tilt. The orientation is incorrect. This is a failure.\n- Conclusion: label = fail, violations = [\"tilted_placement\"]"
    frames:
      - frame_idx: 120
        paths:
          main: "sampled_frames_output/task_5/episode_0/frame_0120_main.png"
          wrist: "sampled_frames_output/task_5/episode_0/frame_0120_wrist.png"
  - title: "Failure Case 2: Tilted Placement"
    explanation: "- In frame 124, the book is placed crookedly. It is not parallel with the compartment walls. This is a failure due to incorrect orientation.\n- Conclusion: label = fail, violations = [\"tilted_placement\"]"
    frames:
      - frame_idx: 124
        paths:
          main: "sampled_frames_output/task_5/episode_2/frame_0124_main.png"
          wrist: "sampled_frames_output/task_5/episode_2/frame_0124_wrist.png"